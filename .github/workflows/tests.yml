name: Validate public interface

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install API dependencies
        run: python -m pip install -r api/requirements.txt
      - name: Run focused tests
        run: python -m unittest discover -s tests -v
      - name: Validate saved model results
        run: python scripts/validate_saved_examples.py
      - name: Check frontend JavaScript syntax
        run: |
          node --check web/series-labels.js
          node --check web/app.js
          node tests/test_frontend_labels.js
      - name: Check local launcher syntax
        shell: pwsh
        run: |
          sh -n start_mac_linux.sh
          $parseTokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "start_windows.ps1"),
            [ref]$parseTokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count) {
            $parseErrors | Format-List
            exit 1
          }
