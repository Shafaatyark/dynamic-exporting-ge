name: Validate public interface

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install API dependencies
        run: python -m pip install -r api/requirements.txt
      - name: Run focused tests
        run: python -m unittest discover -s tests -v
      - name: Validate saved model results
        run: python scripts/validate_saved_examples.py
      - name: Check frontend JavaScript syntax
        run: node --check web/app.js
