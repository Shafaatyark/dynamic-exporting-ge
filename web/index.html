<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Dynamic Exporting GE Simulator</title>
    <meta
      name="description"
      content="Research interface for dynamic general-equilibrium tariff simulations."
    />
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <h1>Dynamic Exporting GE Simulator</h1>
          <p>Teaching and research interface for prescribed tariff transitions.</p>
        </div>
        <div class="status-block">
          <span id="runStatus" class="status-pill">Loading saved result</span>
          <label class="api-label">
            API URL
            <input
              id="apiBase"
              type="url"
              placeholder="Optional live-solver API"
              title="http://127.0.0.1:8000"
              autocomplete="off"
            />
          </label>
        </div>
      </header>

      <main class="workspace">
        <aside class="control-panel" aria-label="Simulation controls">
          <section class="panel-section">
            <h2>Scenario</h2>
            <label>
              Preset
              <select id="scenarioPreset">
                <option value="unilateral_10">Free trade to a 10% unilateral Home tariff</option>
                <option value="bilateral_10">Free trade to a 10% bilateral tariff</option>
                <option value="custom_path">Custom tariff paths</option>
              </select>
            </label>
            <div class="two-col">
              <label>
                Transition periods
                <input id="horizon" type="number" min="1" max="600" step="1" value="80" />
              </label>
              <label>
                Target tariff rate (%)
                <input id="targetRate" type="number" step="0.1" value="10" />
              </label>
            </div>
            <div class="two-col">
              <label>
                Initial gross tariff (τ₂₁)
                <input id="initialTau21" type="number" step="0.01" min="0.01" value="1.00" />
              </label>
              <label>
                Initial gross tariff (τ₁₂)
                <input id="initialTau12" type="number" step="0.01" min="0.01" value="1.00" />
              </label>
            </div>
            <div class="two-col">
              <label>
                Path
                <select id="pathProfile">
                  <option value="step">Step</option>
                  <option value="linear">Linear</option>
                  <option value="frontloaded">Frontloaded</option>
                </select>
              </label>
              <label>
                Tariff rev use
                <select id="rebateType">
                  <option value="lumpsum">Lump sum</option>
                  <option value="invsub">Investment subsidy</option>
                  <option value="labtax">Labor tax</option>
                  <option value="captax">Capital tax</option>
                </select>
              </label>
            </div>
            <label id="customPathWrap" class="hidden">
              Custom gross tariff paths
              <textarea
                id="customPath"
                rows="5"
                spellcheck="false"
                placeholder="tau21,tau12&#10;1.10,1.00&#10;1.10,1.00"
              ></textarea>
            </label>
          </section>

          <section class="panel-section">
            <div class="section-heading">
              <h2>Model settings</h2>
              <button id="resetParams" class="secondary" type="button">Reset</button>
            </div>
            <details class="parameter-group" open>
              <summary>Parameters</summary>
              <div id="parameterGrid" class="parameter-grid"></div>
            </details>
            <details class="parameter-group">
              <summary>Model structure</summary>
              <div id="structureGrid" class="parameter-grid"></div>
            </details>
          </section>
        </aside>

        <section class="result-panel">
          <div class="toolbar">
            <div class="variable-tools">
              <label>
                Transform
                <select id="transformMode">
                  <option value="auto">Auto</option>
                  <option value="level">Level</option>
                  <option value="log_change">Log change</option>
                  <option value="percent_change">Percent change</option>
                  <option value="rate_percent">Tariff rate / percentage points</option>
                  <option value="raw">Raw Dynare value</option>
                </select>
              </label>
              <label class="compact-control">
                Periods shown
                <input id="plotPeriods" type="number" min="1" max="602" step="1" value="80" />
              </label>
              <label>
                Add variable
                <input id="customVariable" type="text" placeholder="e.g. elastc12" />
              </label>
              <button id="addVariable" class="secondary" type="button">Add</button>
            </div>
            <div class="run-tools">
              <button id="loadSaved" class="secondary" type="button">Load saved result</button>
              <button id="runButton" type="button">Run live simulation</button>
              <button id="downloadCsv" class="secondary" type="button">CSV</button>
              <button id="downloadFigure" class="secondary" type="button">Figure (SVG)</button>
            </div>
          </div>

          <div id="errorBox" class="error-box hidden" role="alert"></div>

          <div class="summary-strip" aria-label="Simulation metrics">
            <div><span>Welfare</span><strong id="metricWelfare">--</strong></div>
            <div><span>SS utility</span><strong id="metricSsUtil">--</strong></div>
            <div><span>Revenue PV</span><strong id="metricRevenue">--</strong></div>
            <div><span>Data source</span><strong id="metricMode">--</strong></div>
          </div>

          <div class="plot-wrap">
            <div id="plot"></div>
          </div>

          <div class="selector-wrap">
            <div class="section-heading">
              <h2>Series</h2>
              <div class="selector-actions">
                <input id="variableSearch" type="search" placeholder="Filter series" aria-label="Filter series" />
                <button id="selectCore" class="secondary" type="button">Core</button>
                <button id="clearSeries" class="secondary" type="button">Clear</button>
              </div>
            </div>
            <div id="variableSelector" class="variable-selector"></div>
          </div>
        </section>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
